<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Chelys lyre in the tempered Wine palette's mid terracotta (#C4766A):
       bowl soundbox, upswept arms, zygon crossbar, four strings. Stroke on
       transparent so it reads on light and dark browser chrome; the maskable
       PWA icons set the same drawing on a full wine field. -->
  <g fill="none" stroke="#C4766A" stroke-width="7" stroke-linecap="round">
    <path d="M 40 96 A 24 22 0 0 0 88 96"/>
    <path d="M 40 96 C 24 86, 20 56, 30 20"/>
    <path d="M 88 96 C 104 86, 108 56, 98 20"/>
    <line x1="22" y1="32" x2="106" y2="32"/>
    <line x1="52" y1="32" x2="52" y2="111"/>
    <line x1="60" y1="32" x2="60" y2="114"/>
    <line x1="68" y1="32" x2="68" y2="114"/>
    <line x1="76" y1="32" x2="76" y2="111"/>
  </g>
</svg>
