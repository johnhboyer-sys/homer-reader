# Odyssey — pipeline manifest (Perseus grc2 Greek, verse-line scheme)
#
# Greek source is PerseusDL canonical-greekLit tlg0012.tlg002.perseus-grc2
# (Loeb Greek text of 1919, PD-US). Cited book.line with the sacred vulgate
# lineation: n= attributes are never renumbered. Genuine numbering skips are
# listed under expected_line_gaps (verified against the raw TEI). English
# translations land in Phase 2.

work:
  id: odyssey
  title: "Odyssey"
  author: "Homer"
  tlg_author: "0012"
  tlg_work: "002"
  greek_edition: "Greek text of the Loeb edition (1919)"
  # Path under sources/ to the vendored Perseus Greek TEI.
  greek_source: "perseus/tlg0012.tlg002.perseus-grc2.xml"

citation:
  scheme: verse-line

# No English yet (Phase 2). Empty object satisfies the shared schema frame.
english: {}

# Verified vulgate numbering skips in perseus-grc2 (lines absent from the TEI).
# Shape matches scheme.validate_line_sequence: after → next within `book`.
expected_line_gaps:
  - { book: 10, after: 455, next: 457 }  # Od. 10.456 omitted
  - { book: 16, after: 100, next: 102 }  # Od. 16.101 omitted
  - { book: 23, after: 48, next: 50 }    # Od. 23.49 omitted

# 24 books; start/end are book.line verse refs (first and last present lines).
books:
  - { n: 1, start: "1.1", end: "1.444" }
  - { n: 2, start: "2.1", end: "2.434" }
  - { n: 3, start: "3.1", end: "3.497" }
  - { n: 4, start: "4.1", end: "4.847" }
  - { n: 5, start: "5.1", end: "5.493" }
  - { n: 6, start: "6.1", end: "6.331" }
