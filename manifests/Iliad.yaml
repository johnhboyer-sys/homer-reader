# Iliad — pipeline manifest (TLG Allen 1931 Greek, verse-line scheme)
#
# Greek source (John's decision, 2026-07-17, binding — re-based off Perseus):
# the TLG Diogenes verse-mode export of Allen, T.W., Homeri Ilias, vols. 2-3,
# Oxford: Clarendon Press, 1931 (editio maior; PD-US, pre-1931 cutoff met by
# one year). Read by stage1_tlg_iliad (work.greek_source_kind: tlg), not the
# Perseus TEI reader the Odyssey still uses. Gate A (line-set identity vs. the
# prior Perseus-based build) found 23/24 books identical; two edition-level
# deltas this pipeline stage handles and documents in stage1_tlg_iliad.py's
# module docstring:
#   - Book 18: TLG's line 605 is tagged n="605*" (cosmetic export artifact);
#     normalized to 605.
#   - Book 8: Allen omits lines 548, 550-552 outright (the "hecatomb" lines,
#     traditionally athetized, schol. ad loc.). Allen + supplement: those four
#     lines are supplied from the Perseus Monro-Allen text and flagged
#     `bracketed: true` (see stage1_tlg_iliad.SUPPLEMENTED_LINES). Vulgate
#     numbering stays unbroken; no new expected_line_gaps entry needed.
# Alexandrian critical sigla (obelos, diplē, diplē periestigmenē, asteriskos,
# antisigma) are preserved verbatim per line (optional `sigla` field); only
# the obelos (athetesis) maps to `bracketed: true`. Cited book.line with the
# sacred vulgate lineation: n= attributes are never renumbered. Genuine
# numbering skips are listed under expected_line_gaps (verified against the
# raw TEI/export). English translations still come from the Perseus TEI
# (Murray/Butler/Pope), aligned onto this spine by vulgate line number.

work:
  id: iliad
  title: "Iliad"
  author: "Homer"
  tlg_author: "0012"
  tlg_work: "001"
  greek_edition: "Allen, T.W., Homeri Ilias (Oxford: Clarendon Press, 1931), with Il. 8.548, 550-552 supplied from the Perseus Monro–Allen OCT text (bracketed)"
  greek_source_kind: "tlg"
  # Legacy field: the Perseus Greek TEI path, kept as the source of the four
  # Book 8 supplemented lines above and as the Odyssey-style fallback path
  # (unused while greek_source_kind: tlg selects stage1_tlg_iliad).
  greek_source: "perseus/tlg0012.tlg001.perseus-grc2.xml"

citation:
  scheme: verse-line

# Phase 2: both translations come from the vendored Perseus TEI, aligned to
# the Greek spine by their own <milestone unit="line"> anchors (Murray ~every
# 5 lines with inline Loeb <note> footnotes; Butler similar cadence). `source`
# is a path under sources/. Murray fills the primary 'english' reader slot;
# Butler fills the 'ross' overlay slot (see shared/lib/works.ts).
english:
  primary:
    id: murray
    name: "A. T. Murray (Loeb, 1924–25)"
    source: "perseus/tlg0012.tlg001.perseus-eng3.xml"
  secondary:
    id: butler
    name: "Samuel Butler (1898)"
    source: "perseus/tlg0012.tlg001.perseus-eng4.xml"
  # Phase 3: Pope's verse translation (Project Gutenberg #6130 plaintext),
  # 'third' overlay slot. Book-anchored only, not proportionally aligned
  # within a book — see stage1_pope.py's module docstring for the measured
  # spot-check drift behind that decision.
  third:
    id: pope
    name: "Alexander Pope (1715-20)"
    source: "pope/pope-iliad.txt"

# Verified vulgate numbering skips in perseus-grc2 (lines absent from the TEI).
# Shape matches scheme.validate_line_sequence: after → next within `book`.
expected_line_gaps:
  - { book: 9, after: 457, next: 462 }   # Il. 9.458–461 omitted in this edition
  - { book: 11, after: 542, next: 544 }  # Il. 11.543 omitted
  - { book: 14, after: 268, next: 270 }  # Il. 14.269 omitted

# 24 books; start/end are book.line verse refs (first and last present lines).
books:
  - { n: 1, start: "1.1", end: "1.611" }
  - { n: 2, start: "2.1", end: "2.877" }
  - { n: 3, start: "3.1", end: "3.461" }
  - { n: 4, start: "4.1", end: "4.544" }
  - { n: 5, start: "5.1", end: "5.909" }
  - { n: 6, start: "6.1", end: "6.529" }
  - { n: 7, start: "7.1", end: "7.482" }
  - { n: 8, start: "8.1", end: "8.565" }
  - { n: 9, start: "9.1", end: "9.713" }
  - { n: 10, start: "10.1", end: "10.579" }
  - { n: 11, start: "11.1", end: "11.848" }
  - { n: 12, start: "12.1", end: "12.471" }
  - { n: 13, start: "13.1", end: "13.837" }
  - { n: 14, start: "14.1", end: "14.522" }
  - { n: 15, start: "15.1", end: "15.746" }
  - { n: 16, start: "16.1", end: "16.867" }
  - { n: 17, start: "17.1", end: "17.761" }
  - { n: 18, start: "18.1", end: "18.617" }
  - { n: 19, start: "19.1", end: "19.424" }
  - { n: 20, start: "20.1", end: "20.503" }
  - { n: 21, start: "21.1", end: "21.611" }
