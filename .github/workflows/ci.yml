# Ported from plato-reader's ci.yml (2026-09-09). This repo had no CI at all —
# `git log --all -- .github` was empty — so homer-reader#31, a sanitizer change,
# was merged on a local test run alone. Every job below was run against this
# commit before the workflow was written; none of them is aspirational.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run tests
        run: cd app && npm test

      - name: Verify @shared imports resolve
        run: node scripts/verify-shared-imports.mjs

  shared:
    name: shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        run: cd shared && npm ci

      - name: Run tests
        run: cd shared && npm test

      # svelte-check, not tsc: tsc does not read .svelte files, so this is the
      # only step that typechecks a component. It was held out of the first CI
      # commit because the repo carried 8 errors; those are fixed and this now
      # runs clean over 879 files.
      - name: Typecheck
        run: cd shared && npm run check

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pipeline/.python-version. Was "3.9" (pyproject's floor) until
      # ubuntu-latest became 26.04, which has no 3.9 build (2026-10-26).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install pipeline dependencies
        run: cd pipeline && uv sync

      - name: Run corpus preflight fixture
        run: |
          cd pipeline
          uv run python -m homer_pipeline.preflight \
            tests/fixtures/preflight/valid/data \
            tests/fixtures/preflight/valid/manifests

      # No tolerance for pytest's exit 5 here, unlike the workflow this was
      # ported from: this repo has 28 test files and 470 passing tests, so a run
      # that collects nothing means something broke. aristotle-reader removed
      # the same clause from its own CI on 2026-09-07 for that reason.
      - name: Run pipeline tests
        run: cd pipeline && uv run --with pytest pytest

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo-level scripts are dependency-free (node: imports only), so
      # there is nothing to install.
      - name: Run script tests
        run: npm run test:scripts

  # The whole public site from a clean checkout: the Iliad's Greek in
  # corpus/greek/, the Odyssey's and the translations in sources/, and the
  # build's two outside inputs fetched by pinned checksum. Nothing comes from a
  # laptop (HANDOFF-PORTABILITY.md, test 1).
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pipeline/.python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # build-public.mjs runs pipeline/.venv/bin/python, which uv sync makes.
      - name: Install dependencies
        run: |
          (cd pipeline && uv sync)
          (cd app && npm ci)

      # 186 MB from Diogenes's own release; the archive and each file in it
      # are held to the sha256 pins in pipeline/homer_pipeline/inputs.py.
      - name: Fetch the Morpheus table and the LSJ
        run: |
          echo "DIOGENES_DATA=$RUNNER_TEMP/diogenes-data" >> "$GITHUB_ENV"
          cd pipeline && uv run python -m homer_pipeline.inputs fetch --dir "$RUNNER_TEMP/diogenes-data"

      # Both works, the corpus-wide stages, the gates, the app build, and the
      # link check. No PUBLIC_DATA_ROOT: the data is in the folder, as a
      # mirror serves it.
      - name: Build the site
        run: npm run build:public

      - name: Pack the build
        run: |
          (cd app/dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed 's|  \./|  |' > SHA256SUMS)
          echo "$(wc -l < app/dist/SHA256SUMS) files listed in SHA256SUMS"
          tar -czf "$RUNNER_TEMP/homer-site.tar.gz" -C app/dist .

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: homer-site
          path: ${{ runner.temp }}/homer-site.tar.gz
          if-no-files-found: error
          retention-days: 7
